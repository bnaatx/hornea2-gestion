:root{--bg:#F6F2F2;--card:#fff;--ink:#3a2a24;--mute:#8a7168;--mocha:#A47764;--lav:#ca88dd;--lavd:#8f4fa8;--soft:#f0e3f5;--line:#e7dcdc;--ok:#3f8a5a;--warn:#b5532f;--fd:"Hug Me Tight",Poppins,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c20;--card:#33282d;--ink:#f6f2f2;--mute:#c2a99f;--soft:#47344f;--line:#4a3a41;--lavd:#e0b0ee;--ok:#7fd1a0;--warn:#f0a07f}}
:root[data-theme="dark"]{--bg:#241c20;--card:#33282d;--ink:#f6f2f2;--mute:#c2a99f;--soft:#47344f;--line:#4a3a41;--lavd:#e0b0ee;--ok:#7fd1a0;--warn:#f0a07f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Poppins,system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--lav);z-index:10}
header{background:var(--lav);color:#fff;padding:16px 18px;border-radius:0 0 28px 28px;display:flex;align-items:center;gap:14px}
.logo{height:44px;width:auto;display:block}
.sec{font:400 26px var(--fd);letter-spacing:.3px;padding-left:14px;border-left:2px solid rgba(255,255,255,.6)}
header h1{font:400 40px/1 var(--fd);margin:0;letter-spacing:-.5px}
header p{margin:6px 0 0;font-size:13px;opacity:.95}
main{max-width:560px;margin:0 auto;padding:16px}
h2,h3{font-family:var(--fd);font-weight:400;margin:0 0 10px}
h2{font-size:23px}h3{font-size:20px;margin-top:20px;color:var(--mocha)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:600 14px Poppins,sans-serif;color:var(--lavd);cursor:pointer}
.seg button.on{background:var(--lav);color:#fff}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:10px;flex:1}
input,select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:500 15px Poppins,sans-serif}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--lav);outline-offset:1px}
.row{display:flex;gap:10px}
.prev{background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.prev b{font-size:17px;font-weight:600}
.btn{width:100%;border:0;background:var(--mocha);color:#fff;padding:13px;border-radius:14px;font:600 15px Poppins,sans-serif;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--lavd)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item small{color:var(--mute);display:block}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--lavd);margin-left:6px}
.tag.m{background:var(--mocha);color:#fff}.tag.d{background:var(--warn);color:#fff}
.amt{text-align:right;white-space:nowrap}.amt b{font:600 17px Poppins,sans-serif}
.gan{color:var(--ok);font-size:12px;font-weight:600}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 0 0 6px}
.big{font:700 30px/1.1 Poppins,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.k span{font-size:12px;color:var(--mute)}
.k.hi{background:var(--lav);border-color:var(--lav);color:#fff}.k.hi span{color:#fff;opacity:.9}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border:0}
.note{font-size:12px;color:var(--mute);margin:4px 2px 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font:500 11px Poppins,sans-serif;padding:6px 0 4px;cursor:pointer;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--lavd);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:18px}
.row label{min-width:0;flex:1 1 0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;inline-size:100%;min-height:44px;text-align:left;box-sizing:border-box}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
input,select{box-sizing:border-box}
.mes{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mes h2{margin:0;text-transform:capitalize}
.mes button{border:0;background:var(--soft);color:var(--lavd);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.ley{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal b{text-align:center;font-size:11px;color:var(--mute);font-weight:500}
.dia{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:54px;padding:4px;font:500 13px Poppins,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.dia.sel{border-color:var(--lav);background:var(--soft)}
.dia div{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dia i{width:8px;height:8px;border-radius:50%}
.pc summary{list-style:none;cursor:pointer}.pc summary::-webkit-details-marker{display:none}
.det{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:400 14px Poppins,sans-serif;min-height:70px;resize:vertical}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--lav);border-radius:99px}
nav button{font-size:11px}
</style>

const NUMW={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veinticinco:25,treinta:30,cuarenta:40,cincuenta:50};
function leerMsg(t){
const txt=t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const re=/(\$\s?\d[\d.,]*)|(\d+)(?![\d.,]*\d)|\b(uno|una|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciseis|diecisiete|dieciocho|diecinueve|veinticinco|veinte|treinta|cuarenta|cincuenta)\b|(oreos?)|(are[qk]u?i?pes?)|(nutel+as?)|(kinders?)|(chips?|m&m\S*|mym)/g;
const q={},notas=[];let hay=false;
txt.split(/\n/).forEach(ln=>{
const tk=[];let m;re.lastIndex=0;
while((m=re.exec(ln))){
if(m[1])continue;
if(m[2]){const n=+m[2];if(n>0&&n<=500)tk.push({k:"n",v:n})}
else if(m[3])tk.push({k:"n",v:NUMW[m[3]]});
else if(m[4])tk.push({k:"f",v:"Oreo"});else if(m[5])tk.push({k:"f",v:"Arequipe"});
else if(m[6])tk.push({k:"f",v:"Nutella"});else if(m[7])tk.push({k:"f",v:"Kinder"});
else if(m[8])tk.push({k:"x",v:m[8]})}
tk.forEach((x,i)=>{if(x.k==="f"||x.k==="x"){
let n=null;
if(i>0&&tk[i-1].k==="n"&&!tk[i-1].u)n=tk[i-1];else if(i<tk.length-1&&tk[i+1].k==="n"&&!tk[i+1].u)n=tk[i+1];
if(n){n.u=1;if(x.k==="f"){q[x.v]=(q[x.v]||0)+n.v;hay=true}else notas.push(`${n.v} de "${x.v}" no se vende, revisa`)}
else notas.push(`No encontré cuántos de ${x.v}`)}});
tk.forEach(x=>{if(x.k==="n"&&!x.u)notas.push(`Número suelto: ${x.v} (en "${ln.trim().slice(0,40)}")`)})});
const cliente=/laura/.test(txt)?"Laura Ardila":/angie/.test(txt)?"Angie Cardozo":null;
if(!hay)notas.unshift("No encontré sabores con cantidad.");
return{q,notas,cliente}}

$("#pv").onchange=e=>{const t=e.target,f=t.dataset.f;if(!f)return;
if(f==="f"&&!t.value)return;

else if(f==="f"||f==="h"||f==="s")pv()};

$("#na").onclick=()=>{const t=$("#nt").value.trim();if(!t||!$("#nf").value){$("#nt").focus();return}

S.mes=$("#nf").value.slice(0,7);S.dia=null;parrilla()};

/* ---------- Cajitas de Nu ---------- */
S.caj=[{n:"Próxima compra del mes",p:50,m:360000},{n:"Ahorro Hornea2",p:20,m:0},{n:"Ganancia de los dos",p:30,m:0}];
function cajitas(){
const g=Math.max(0,sum(S.ventas.filter(x=>x.p!=="Debe"),gan));
const tp=sum(S.caj,c=>c.p);
$("#cajitas").innerHTML=`<h3>Cajitas de Nu</h3><p class="note">La ganancia se reparte en las cajitas según el porcentaje. No cuenta lo que te deben.</p>
${S.caj.map((c,i)=>{const v=g*c.p/100,pc=c.m>0?Math.min(100,v/c.m*100):0;return `<div class="card"><div class="item"><div><b>${esc(c.n)}</b><small>${c.p}% de la ganancia</small></div><div class="amt"><b>${fm(v)}</b></div></div>
${c.m>0?`<div class="bar"><i style="width:${pc}%"></i></div><small class="note">${Math.round(pc)}% de la meta de ${fm(c.m)}</small>`:""}
<div class="row"><label>Porcentaje<input type="number" inputmode="numeric" data-i="${i}" data-k="p" value="${c.p}"></label><label>Meta (opcional)<input type="number" inputmode="numeric" data-i="${i}" data-k="m" value="${c.m}"></label></div></div>`}).join("")}
<p class="note" style="color:${tp===100?"var(--ok)":"var(--warn)"}">${tp===100?"Los porcentajes suman 100%.":"Los porcentajes suman "+tp+"%. Deben sumar 100%."}</p>`;

/* ---------- Insumos según la receta ---------- */
S.rec=[
{n:"Mezcla brownie Corona",u:"mezclas",t:1,tz:0,pn:4,pz:1},
{n:"Arequipe (sabor Arequipe)",f:"Arequipe",u:"g",t:0,tz:397,pn:0,pz:0},
{n:"Huevos",u:"un",t:3,tz:null,pn:0,pz:0},
{n:"Mantequilla",u:"g",t:100,tz:219,pn:1,pz:250},
{n:"Azúcar morena",u:"g",t:200,tz:1276,pn:3,pz:500},
{n:"Aceite vegetal",u:"g",t:150,tz:null,pn:0,pz:0},
{n:"Leche",u:"g",t:200,tz:null,pn:0,pz:0},
{n:"Harina",u:"g",t:200,tz:0,pn:1,pz:1000},
{n:"Café instantáneo",u:"cdta",t:1,tz:null,pn:0,pz:0},
{n:"Bandejas y tapas",u:"un",t:16,tz:null,pn:0,pz:0}];
function insumos(){
const base=r=>r.f?sum(S.ventas.filter(x=>x.s===r.f),x=>x.q+x.r):sum(S.ventas,x=>x.q+x.r);
const est=r=>{
if(r.tz==null&&!((r.pn||0)*(r.pz||0)>0))return null;
const used=base(r)/16*(r.t||0),pz=r.pz||0;
let tz=(r.tz||0)-used,pn=r.pn||0;
if(tz<0&&pz>0){const ab=Math.min(pn,Math.ceil(-tz/pz));pn-=ab;tz+=ab*pz}
const left=tz+pn*pz;
return{tz:Math.max(0,tz),pn,left,n:r.t?Math.floor(Math.max(0,left)/r.t):null,sinRes:pz>0&&pn<1}};
const E=S.rec.map(est);
const falta=S.rec.map((r,i)=>({r,e:E[i]})).filter(({e})=>e&&((e.n!==null&&e.n<2)||e.sinRes));
const mins=E.filter(e=>e&&e.n!==null).map(e=>e.n);
const tan=sum(S.ventas,x=>x.q+x.r)/16;
$("#v").innerHTML=`<div class="grid"><div class="k hi"><span>Tandas vendidas</span><div class="big">${tan.toFixed(1)}</div></div>
<div class="k"><span>Alcanza para</span><div class="big">${mins.length?Math.min(...mins):"—"} tandas</div></div></div>
<p class="note">Una tanda son 16 brownies. Aquí anotas lo que tienes y la app te dice para cuántas tandas alcanza. Se gasta primero lo abierto y después los paquetes sin abrir; lo ideal es que siempre quede 1 paquete sin abrir.</p>
${falta.length?`<div class="card" style="border-color:var(--warn)"><h2>Toca comprar</h2>${falta.map(({r,e})=>`<div class="line"><span>${esc(r.n)}</span><b style="color:var(--warn)">${e.n!==null&&e.n<1?"Falta comprar":e.n!==null&&e.n<2?"Se está acabando":"Sin paquete de reserva"}</b></div>`).join("")}</div>`:`<div class="card"><b style="color:var(--ok)">Insumos al día.</b></div>`}
${S.rec.map((r,i)=>{const e=E[i];
const tot0=(r.tz||0)+(r.pn||0)*(r.pz||0),pc=e&&tot0?Math.max(0,Math.min(100,e.left/tot0*100)):0;
const malo=e&&((e.n!==null&&e.n<2)||e.sinRes);
const tag=!e?"Sin dato":e.n!==null&&e.n<1?"Falta":e.n!==null&&e.n<2?"Poco":e.sinRes?"Sin reserva":"Bien";
const tot=e?Math.round(e.left):0;
const txt=!e?((r.pn||0)>0&&!(r.pz>0)?"Falta anotar cuánto trae cada paquete":"Escribe cuánto tienes para calcular"):`Tienes ${tot.toLocaleString("es-CO")} ${r.u} en total<br><b>${e.n!==null?`Alcanza para ${e.n} ${e.n===1?"tanda":"tandas"} (${e.n*16} brownies)`:"Falta anotar cuánto gasta una tanda"}</b>`;
const f=(k,lab,hint,val,dec)=>`<label>${lab}<input type="number" inputmode="${dec?"decimal":"numeric"}" data-i="${i}" data-k="${k}" value="${val}" placeholder="0"><small class="note">${hint}</small></label>`;
return `<div class="card"><div class="item"><div><b>${esc(r.n)}</b><small>${txt}</small></div><span class="tag ${malo?"d":""}">${tag}</span></div>
<div class="bar"><i style="width:${pc}%;${malo?"background:var(--warn)":""}"></i></div>
<div class="row">${f("t","Gasta por tanda","En "+r.u+", para 16 brownies",r.t,1)}${f("tz","Tienes abierto","En "+r.u+", lo del recipiente",r.tz==null?"":r.tz,1)}</div>
<div class="row">${f("pn","Paquetes sin abrir","Cuántos tienes guardados",r.pn||0,0)}${f("pz","Trae cada paquete","En "+r.u+", según el empaque",r.pz||0,1)}</div></div>`}).join("")}`;
$("#v").querySelectorAll("input").forEach(el=>el.onchange=()=>{const k=el.dataset.k;S.rec[+el.dataset.i][k]=(k==="tz"&&el.value==="")?null:(+el.value||0);insumos()})}
try{const d=JSON.parse(localStorage.getItem("hornea2-gestion")||"null");if(d&&(d.ver===3||d.ver===2)){const old=d.ver;Object.assign(S,d);nid=Math.max(nid,...S.pa.map(x=>x.id));gid=Math.max(gid,...S.ventas.map(x=>x.g||0));
if(old<3){S.may=DEFMAY();S.pm={p:5000,k:7000};S.cs={Oreo:2198,Arequipe:2574,Nutella:3343,Kinder:4119};
if(!S.compras.some(x=>/Huevos/.test(x.n)))S.compras.push({n:"Huevos cubeta de 30 × 2",tp:"Ingrediente",tienda:"Otra",v:31000,w:"Sin definir"},{n:"Aceite (~3 kg) y leche (~4 L) (estimado)",tp:"Ingrediente",tienda:"Otra",v:75000,w:"Sin definir"});
S.pa=S.pa.concat(IDEAS())}S.ver=3}
if(!S.cat||!S.cat.length)S.cat=CAT0();
if(d&&!d.v6){const gg=Math.max(110,...S.ventas.map(x=>x.g||0))+1;
S.ventas.unshift({g:gg,c:"Jhovani",l:"Banco de Bogotá",t:"menor",s:"Sin definir",q:2,r:0,p:"Debe",d:"2026-11-01"},{g:gg+1,c:"David",l:"Banco de Bogotá",t:"menor",s:"Oreo",q:1,r:0,p:"Efectivo",d:"2026-11-01"});
["David","Jhovani"].forEach(n=>{if(!S.nom["Banco de Bogotá"].includes(n))S.nom["Banco de Bogotá"].push(n)});gid=Math.max(gid,gg+1)}
if(d&&!d.v5){
S.ventas=S.ventas.filter(x=>x.c!=="Cliente de ejemplo"&&x.c!=="Universidad (sin nombre)"&&x.s!=="Chips Chocolate");
S.compras=S.compras.filter(x=>!/^Chips de chocolate/.test(x.n));S.cat=S.cat.filter(x=>x.n!=="Chips de chocolate");
S.rec=S.rec.filter(x=>x.f!=="Chips Chocolate");delete S.cs["Chips Chocolate"];delete S.mix["Chips Chocolate"];
const dbt=S.ventas.some(x=>x.c==="Laura Ardila"&&x.p==="Debe"),gg=Math.max(110,...S.ventas.map(x=>x.g||0))+1;
if(!dbt)[["Arequipe",6],["Nutella",3],["Oreo",4]].forEach(([n,q])=>S.ventas.unshift({g:gg,c:"Laura Ardila",l:"Mayor",t:"mayor",s:n,q,tot:13,r:0,p:"Debe",d:"2026-11-01"}));
S.ventas.unshift({g:gg+1,c:"Bianca",l:"Banco de Bogotá",t:"menor",s:"Oreo",q:1,r:0,p:"Nu",d:"2026-11-01"},{g:gg+2,c:"Andrés",l:"Banco de Bogotá",t:"menor",s:"Sin definir",q:1,r:0,p:"Nu",d:"2026-11-01"});
if(!S.nom["Banco de Bogotá"].includes("Bianca"))S.nom["Banco de Bogotá"].push("Bianca");
gid=Math.max(gid,gg+2)}
S.compras.forEach(x=>{x.w="Caja";if(!x.d)x.d="2026-10-19"});
if(!S.v4){S.v4=1;S.compras.forEach(x=>{if(/^Nutella 140/.test(x.n)){x.n="Nutella 140 g × 6 ($13.000 c/u)";x.v=78000}});if(S.cs.Nutella===3443)S.cs.Nutella=3343}}catch(e){}
render();
/* ---------- Sincronización (Supabase) ---------- */
const DOM={ventas:["ventas","ent","nom"],compras:["compras","cat","plan","mano"],caja:["ini","den","den2","nuRate","nuDesde","caj"],insumos:["rec"],parrilla:["pa"],precios:["may","mayV","vip","pm","cs"]};
const sb=window.supabase.createClient(window.H2_CONFIG.supabaseUrl,window.H2_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const lastJ={};let me="",ready=false,pend=false,canal=null;
const snapD=d=>{const o={};DOM[d].forEach(k=>o[k]=S[k]);return JSON.stringify(o)};
const stSy=t=>{const e=$("#sy");if(e)e.textContent=t};
const saveLocal=()=>{try{localStorage.setItem("hornea2-gestion",JSON.stringify(S))}catch(e){}};
const aplicar=(d,j)=>{Object.assign(S,JSON.parse(j));nid=Math.max(nid,...S.pa.map(x=>x.id));gid=Math.max(gid,...S.ventas.map(x=>x.g||0))};
const enEdicion=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function remoto(d,j){aplicar(d,j);if(enEdicion())pend=true;else render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pend&&!enEdicion()){pend=false;render()}},300));
async function pushAll(){saveLocal();if(!ready)return;
for(const d in DOM){const j=snapD(d);
if(j!==lastJ[d]){lastJ[d]=j;
const {error}=await sb.from("estado").upsert({dominio:d,j,ts:Date.now(),por:me});
if(error){lastJ[d]=null;stSy("Sin conexión")}else stSy("Sincronizado")}}}
let tmr=null;["input","change","click"].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(tmr);tmr=setTimeout(pushAll,500)},true));
setInterval(pushAll,3000);
let semilla=null;
async function cargaRemota(inicial){
const {data,error}=await sb.from("estado").select("dominio,j");
if(error)throw error;
const m={};data.forEach(r=>m[r.dominio]=r.j);let cambio=false;
if(inicial&&!semilla){try{semilla=await (await fetch("seed.json",{cache:"no-store"})).json()}catch(e){semilla={}}}
for(const d in DOM){
if(m[d]){if(m[d]!==lastJ[d]&&(inicial||snapD(d)===lastJ[d])){lastJ[d]=m[d];if(m[d]!==snapD(d)){aplicar(d,m[d]);cambio=true}}}
else if(inicial){const j=semilla[d]||snapD(d);const {error:e2}=await sb.from("estado").upsert({dominio:d,j,ts:Date.now(),por:me});if(e2)throw e2;lastJ[d]=j;if(j!==snapD(d)){aplicar(d,j);cambio=true}}}
ready=true;if(cambio)render();stSy("Sincronizado")}
function suscribe(){if(canal)return;
canal=sb.channel("estado-h2").on("postgres_changes",{event:"*",schema:"public",table:"estado"},p=>{const r=p.new;
if(r&&r.j&&DOM[r.dominio]&&r.j!==lastJ[r.dominio]){lastJ[r.dominio]=r.j;remoto(r.dominio,r.j)}}).subscribe()}
setInterval(()=>{if(ready)cargaRemota(false).catch(()=>stSy("Sin conexión"))},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ready)cargaRemota(false).catch(()=>{})});
async function arranca(session){
if(!session){ready=false;$("#login").hidden=false;return}
me=session.user.email||"";$("#login").hidden=true;stSy("Conectando…");render();
try{await cargaRemota(true);suscribe()}catch(e){console.error(e);stSy(/permission|policy|row-level/i.test(e.message||"")?"Sin permiso":"Sin conexión")}}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();
const err=$("#loginErr"),btn=$("#loginBtn");err.hidden=true;btn.disabled=true;btn.textContent="Entrando…";
const {data,error}=await sb.auth.signInWithPassword({email:$("#l_email").value.trim(),password:$("#l_pass").value});
btn.disabled=false;btn.textContent="Entrar";
if(error){err.hidden=false;err.textContent=/invalid/i.test(error.message)?"El correo o la contraseña no coinciden.":"No se pudo entrar. Revisa tu conexión.";return}
arranca(data.session)});
async function cambiarPw(){const p=prompt("Nueva contraseña (mínimo 8 caracteres)");if(!p)return;
if(p.length<8){alert("Debe tener mínimo 8 caracteres.");return}
const {error}=await sb.auth.updateUser({password:p});alert(error?"No se pudo cambiar. Inténtalo de nuevo.":"Contraseña cambiada.")}
async function salir(){await sb.auth.signOut();location.reload()}
const atajo=()=>{const h=(location.hash||"").slice(1);const m={ingreso:"ventas",venta:"ventas",ventas:"ventas",gasto:"compra",compra:"compra",compras:"compra",caja:"caja",insumos:"insumos",informe:"informe",parrilla:"parrilla"};if(m[h]){go(m[h])}};
window.addEventListener("hashchange",atajo);
sb.auth.getSession().then(({data})=>{arranca(data.session).then(atajo)});
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){ready=false;$("#login").hidden=false}});
</script>
</body>
